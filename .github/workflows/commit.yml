name: "Commit"

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  checks: write
  contents: read
  security-events: write

jobs:
  build:
    name: "Go / Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Validate build"
        run: ./scripts/golang/validate_build.sh

  vet:
    name: "Go / Vet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Validate formatting"
        run: ./scripts/golang/validate_formatting.sh

      - name: "Validate vet and modules"
        run: ./scripts/golang/validate_vet.sh

  test:
    name: "Go / Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Install gotestsum"
        run: go install gotest.tools/gotestsum@latest

      - name: "Run tests"
        run: ./scripts/golang/validate_test.sh

      - name: "Publish test report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: junit-report.xml

  lint:
    name: "Go / Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Install golangci-lint"
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: "Run lint"
        run: ./scripts/golang/validate_lint.sh

  complexity:
    name: "Go / Complexity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Install gocyclo"
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: "Run complexity checks"
        run: ./scripts/golang/validate_complexity.sh

  security:
    name: "Go / Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Install security tools"
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: "Run security checks"
        run: ./scripts/golang/validate_security.sh

  licenses:
    name: "Go / Licenses"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Install go-licenses"
        run: go install github.com/google/go-licenses@latest

      - name: "Run license checks"
        run: ./scripts/golang/validate_licenses.sh

  codeql:
    name: "CodeQL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: "Autobuild"
        uses: github/codeql-action/autobuild@v4

      - name: "Analyze"
        uses: github/codeql-action/analyze@v4
